<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dental Website Preview</title>
</head>
<body>

    <!-- ========================================== -->
    YOUR WEBSITE CONTENT
    <!-- ========================================== -->

    <!-- Clinic Main Title / Header -->
    <h1 class="clinic-name">Default Clinic Name</h1>

    <!-- Location / Address -->
    <p class="clinic-address">Default Address, City</p>

    <!-- Email & Phone -->
    <p>Email: <a href="#" class="clinic-email">info@default.com</a></p>
    <p>Phone: <a href="#" class="clinic-phone">123-456-7890</a></p>

    <!-- Social Media Links Section -->
    <div class="social-links-section">
        <p>LinkedIn: <a href="#" id="linkedin-link" class="clinic-linkedin" target="_blank">View LinkedIn Profile</a></p>
        <p>Instagram: <a href="#" id="instagram-link" class="clinic-instagram" target="_blank">View Instagram Profile</a></p>
    </div>

    <!-- Doctor Cards Section -->
    <div class="doctors-section">
        <div id="doctor-1-card" class="doctor-card">
            <h3 class="doctor-1-name">Dr. First Doctor</h3>
        </div>
        <div id="doctor-2-card" class="doctor-card">
            <h3 class="doctor-2-name">Dr. Second Doctor</h3>
        </div>
        <div id="doctor-3-card" class="doctor-card">
            <h3 class="doctor-3-name">Dr. Third Doctor</h3>
        </div>
    </div>


    <!-- ========================================== -->
    JAVASCRIPT TO MAKE IT DYNAMIC (Paste before </body>)
    <!-- ========================================== -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        
        // 1. Grab values from the URL link including social links
        const clinic = params.get('clinic');
        const address = params.get('address');
        const email = params.get('email');
        const phone = params.get('phone');
        const linkedin = params.get('linkedin');
        const instagram = params.get('instagram');
        const dr1 = params.get('dr1');
        const dr2 = params.get('dr2');
        const dr3 = params.get('dr3');
        
        // 2. Update Clinic Name & Page Title
        if (clinic) {
          document.querySelectorAll('.clinic-name, h1').forEach(el => {
            el.textContent = clinic;
          });
          document.title = clinic + " - Website Preview";
        }
        
        // 3. Update Location / Address
        if (address) {
          document.querySelectorAll('.clinic-address').forEach(el => {
            el.textContent = address;
          });
        }

        // 4. Update Email
        if (email) {
          document.querySelectorAll('.clinic-email').forEach(el => {
            el.textContent = email;
            if(el.tagName === 'A') el.href = 'mailto:' + email;
          });
        }

        // 5. Update Phone / Contact
        if (phone) {
          document.querySelectorAll('.clinic-phone').forEach(el => {
            el.textContent = phone;
            if(el.tagName === 'A') el.href = 'tel:' + phone;
          });
        }

        // 6. Update LinkedIn Profile Link (and hide if empty)
        const linkedinContainer = document.getElementById('linkedin-link');
        if (linkedinContainer) {
          if (linkedin && linkedin.trim() !== "") {
            linkedinContainer.href = linkedin;
            linkedinContainer.style.display = 'inline';
          } else {
            linkedinContainer.parentElement.style.display = 'none'; // Hides the whole line if missing
          }
        }

        // 7. Update Instagram Profile Link (and hide if empty)
        const instagramContainer = document.getElementById('instagram-link');
        if (instagramContainer) {
          if (instagram && instagram.trim() !== "") {
            instagramContainer.href = instagram;
            instagramContainer.style.display = 'inline';
          } else {
            instagramContainer.parentElement.style.display = 'none'; // Hides the whole line if missing
          }
        }

        // 8. Update Doctor 1
        if (dr1) {
          const doc1 = document.querySelector('.doctor-1-name');
          if (doc1) doc1.textContent = dr1;
        }

        // 9. Update Doctor 2 (and hide card completely if empty)
        const doc2Card = document.getElementById('doctor-2-card');
        const doc2El = document.querySelector('.doctor-2-name');
        if (doc2Card) {
          if (dr2 && dr2.trim() !== "") {
            if (doc2El) doc2El.textContent = dr2;
            doc2Card.style.display = 'block';
          } else {
            doc2Card.style.display = 'none';
          }
        }

        // 10. Update Doctor 3 (and hide card completely if empty)
        const doc3Card = document.getElementById('doctor-3-card');
        const doc3El = document.querySelector('.doctor-3-name');
        if (doc3Card) {
          if (dr3 && dr3.trim() !== "") {
            if (doc3El) doc3El.textContent = dr3;
            doc3Card.style.display = 'block';
          } else {
            doc3Card.style.display = 'none';
          }
        }
      });
    </script>
</body>
</html>
